<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, serverTimestamp,
    enableIndexedDbPersistence
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDV_pqT1TL_pp_cApQI4n7SHqdVqmpRClY",
    authDomain: "app-gelats.firebaseapp.com",
    projectId: "app-gelats",
    storageBucket: "app-gelats.firebasestorage.app",
    messagingSenderId: "202003790398",
    appId: "1:202003790398:web:e837be35cdf4149dbeef6f",
  };

  try {
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    // permite seguir viendo la ultima copia sincronizada si el dispositivo se queda sin conexion
    enableIndexedDbPersistence(db).catch(() => {});

    window.ObradorSync = {
      ready: true,
      subscribeRecipes(cb) {
        return onSnapshot(collection(db, "recetas"), (snap) => {
          const list = [];
          snap.forEach(d => list.push({ ...d.data(), id: d.id }));
          cb(list);
        }, (err) => { console.warn("[ObradorSync] error leyendo recetas:", err.message); });
      },
      subscribeIngredients(cb) {
        return onSnapshot(collection(db, "ingredientes_personalizados"), (snap) => {
          const list = [];
          snap.forEach(d => list.push({ ...d.data(), id: d.id }));
          cb(list);
        }, (err) => { console.warn("[ObradorSync] error leyendo ingredientes:", err.message); });
      },
      saveRecipe(recipe) {
        const id = String(recipe.id);
        return setDoc(doc(db, "recetas", id), { ...recipe, id, updatedAt: serverTimestamp() })
          .catch(err => console.warn("[ObradorSync] error guardando receta:", err.message));
      },
      deleteRecipe(id) {
        return deleteDoc(doc(db, "recetas", String(id)))
          .catch(err => console.warn("[ObradorSync] error borrando receta:", err.message));
      },
      saveIngredient(ing) {
        const id = String(ing.id);
        return setDoc(doc(db, "ingredientes_personalizados", id), { ...ing, id })
          .catch(err => console.warn("[ObradorSync] error guardando ingrediente:", err.message));
      },
      deleteIngredient(id) {
        return deleteDoc(doc(db, "ingredientes_personalizados", String(id)))
          .catch(err => console.warn("[ObradorSync] error borrando ingrediente:", err.message));
      },
    };
  } catch (e) {
    console.warn("[ObradorSync] Firebase no disponible, la app seguirá funcionando solo local:", e.message);
    window.ObradorSync = null;
  }
  window.dispatchEvent(new Event("obrador-sync-ready"));
</script>

ada)","q":"450 cc","nota":""},{"n":"Oli de coco neutre","q":"25 g","nota":""},{"n":"Cardamom mòlt","q":"1 culleradeta","nota":""},{"n":"Suc de llimona (opcional)","q":"1/2 llimona","nota":""}],"prep":"Triturar la crema base amb el plàtan, l'oli de coco, el cardamom i la llimona. Congelar amb heladora o mixer-freezer.","sabor":["Vegà"]},{"categoria":"Gelat vegà","nombre":"Gelat de mango, coco i espirulina","pagina":13,"tiempo":"45 min","ingredientes":[{"n":"Sucre ros orgànic (almívar)","q":"1/4 tassa","nota":""},{"n":"Aigua filtrada (almívar)","q":"1/4 tassa","nota":""},{"n":"Mangos madurs","q":"2 unitats","nota":"estimat, ~200g cadascun"},{"n":"Oli de coco verge","q":"25 g","nota":""},{"n":"Espirulina","q":"10 g","nota":""},{"n":"Aigua filtrada","q":"200 cc","nota":""},{"n":"Almívar","q":"100 cc","nota":""}],"prep":"Fer un almívar amb sucre i aigua. Triturar la polpa de mango amb l'oli de coco, l'almívar, l'aigua i l'espirulina. Congelar.","sabor":["Vegà"]},{"categoria":"Gelat vegà","nombre":"Gelat de gianduia i avellanes","pagina":14,"tiempo":"2 hores","ingredientes":[{"n":"Avellanes","q":"1 tassa","nota":"estimat"},{"n":"Anacards hidratats","q":"1 tassa","nota":"estimat"},{"n":"Aigua filtrada","q":"2 tasses","nota":""},{"n":"Cacau amarg en pols","q":"2 cullerades","nota":"convertit amb 85 g/tassa"},{"n":"Sal marina","q":"1 pessic","nota":""},{"n":"Mantega de cacau fosa","q":"2 cullerades","nota":"convertit amb 180 g/tassa (oli)"},{"n":"Extracte de vainilla","q":"c/n","nota":""},{"n":"Sucre (mascavat/ros) o xilitol","q":"2 tasses","nota":""}],"prep":"Torrar i pelar les avellanes, triturar 3 x 20 min fins obtenir un pralinat sense aigua ni oli. Triturar els anacards amb aigua (crema raw), afegir el pralinat, l'edulcorant, la sal, la vainilla, la mantega de cacau i el cacau. Congelar.","sabor":["Vegà"]},{"categoria":"Gelat vegà","nombre":"Gelat d'api i fruits vermells","pagina":15,"tiempo":"10 min prep. + 2 h refrigeració","ingredientes":[{"n":"Aigua filtrada","q":"1 tassa","nota":""},{"n":"Farina de blat de moro morat (api)","q":"4 cullerades","nota":"convertit amb 110 g/tassa (midó de blat de moro)"},{"n":"Llimona (suc i pell)","q":"1/2 unitat","nota":""},{"n":"Oli de coco neutre","q":"2 cullerades","nota":""},{"n":"Extracte de vainilla","q":"1 cullerada","nota":""},{"n":"Fruits vermells","q":"150 g","nota":""},{"n":"Sucre (mascavat/ros) o xilitol","q":"200 g","nota":""},{"n":"Pebre negre, maqui, cardamom o canyella (opcional)","q":"c/n","nota":""}],"prep":"Coure l'api amb aigua fins bullir, refredar 2h a la nevera. Triturar amb els fruits vermells, la llimona, la vainilla, l'oli de coco i l'edulcorant. Congelar.","sabor":["Vegà"]},{"categoria":"Gelat vegà","nombre":"Gelat de sèsam","pagina":16,"tiempo":"30 min","ingredientes":[{"n":"Llavors de sèsam (cruixent)","q":"1/2 tassa","nota":"estimat"},{"n":"Sucre mascavat (cruixent)","q":"1/2 tassa","nota":""},{"n":"Oli de coco neutre (cruixent)","q":"1 cullerada","nota":""},{"n":"Sal marina (cruixent)","q":"1 pessic","nota":""},{"n":"Crema base estil anglesa","q":"2 tasses","nota":""},{"n":"Cobertura de xocolata fosa","q":"70 g","nota":""},{"n":"Oli de sèsam torrat","q":"2 culleradetes","nota":""}],"prep":"Torrar el sèsam amb oli de coco, afegir la sal i el sucre mascavat fins fondre (cruixent). Afegir l'oli de sèsam a la crema base i congelar. Banyar en xocolata i cobrir amb el cruixent.","sabor":["Vegà"]},{"categoria":"Postre muntat (vegà)","nombre":"Sandvitxos gelats (tapes)","pagina":17,"tiempo":"45 min prep. + 5 h congelat","ingredientes":[{"n":"Farina d'arròs blanc","q":"135 g","nota":""},{"n":"Farina d'ametlla","q":"30 g","nota":""},{"n":"Fècula de mandioca","q":"100 g","nota":""},{"n":"Sucre ros orgànic o xilitol","q":"100 g","nota":""},{"n":"Llimona (ratlladura i suc)","q":"1 unitat","nota":""},{"n":"Llevat en pols","q":"1 culleradeta","nota":""},{"n":"Sal","q":"1 pessic","nota":""},{"n":"Psyllium","q":"10 g","nota":""},{"n":"Oli de coco neutre","q":"3 cullerades","nota":""},{"n":"Llet vegetal (50cc aigua + 10g ametlla/castanya/coco)","q":"60 cc","nota":""},{"n":"Extracte de vainilla","q":"1 culleradeta","nota":""},{"n":"Gelat a elecció","q":"c/n","nota":"farciment"}],"prep":"Triturar tots els secs i líquids fins obtenir una massa homogènia. Estirar a 1/2 cm entre papers, refredar 2h, tallar les tapes, enfornar a 180-200°C 25 min. Farcir amb gelat ferm i congelar 3h.","sabor":["Vegà"]},{"categoria":"Postre muntat (vegà)","nombre":"Melmelada de llet d'anacards","pagina":19,"tiempo":"30 min prep. + 12 h congelat","ingredientes":[{"n":"Anacards hidratats","q":"100 g","nota":""},{"n":"Aigua filtrada","q":"100 cc","nota":""},{"n":"Extracte de vainilla","q":"1 culleradeta","nota":""},{"n":"Sucre ros orgànic","q":"200 g","nota":""},{"n":"Sal marina","q":"1 pessic","nota":""},{"n":"Mel de canya, agave o xarop","q":"1 cullerada","nota":""},{"n":"Mantega plant based","q":"100 g","nota":""}],"prep":"Triturar els anacards amb aigua. Fer un caramel clar amb sucre i mel. Triturar amb la crema d'anacards en 3 parts, afegir la mantega plant based. Reposar 12h i batre fins obtenir una textura untuosa.","sabor":["Vegà"]},{"categoria":"Postre muntat (vegà)","nombre":"El gelat de vainilla (per a bombons)","pagina":20,"tiempo":"5 min","ingredientes":[{"n":"Crema base estil anglesa","q":"240 g","nota":""},{"n":"Extracte de vainilla","q":"1 culleradeta","nota":""}],"prep":"Aromatitzar la crema base amb vainilla i congelar ben ferm.","sabor":["Vegà"]},{"categoria":"Postre muntat (vegà)","nombre":"Els bombons gelats","pagina":21,"tiempo":"15 min","ingredientes":[{"n":"Gelat de vainilla","q":"240 g","nota":""},{"n":"Melmelada de llet d'anacards","q":"30 g","nota":""},{"n":"Cobertura de xocolata","q":"250 g","nota":""}],"prep":"Formar esferes de melmelada congelades, embolicar-les amb gelat de vainilla, congelar i banyar en cobertura de xocolata.","sabor":["Vegà"]},{"categoria":"Base (vegana)","nombre":"Tepache (per al gelat de pinya)","pagina":22,"tiempo":"15 min prep. + 48 h repòs","ingredientes":[{"n":"Pell de pinya fresca","q":"1 unitat","nota":""},{"n":"Aigua filtrada","q":"3 l","nota":""},{"n":"Sucre ros orgànic","q":"1 tassa","nota":""},{"n":"Cítrics, gingebre, clau o bitxo (opcional)","q":"c/n","nota":""}],"prep":"Picar la pell de pinya amb sucre, cobrir amb aigua, tapar amb un drap i fermentar 48h a temperatura ambient lluny de la llum. Colar i refrigerar 2 dies.","sabor":["Vegà"]},{"categoria":"Gelat vegà","nombre":"Gelat de pinya i tepache","pagina":23,"tiempo":"5 min prep. + 2 h congelat","ingredientes":[{"n":"Pinya ben madura","q":"300 g","nota":""},{"n":"Tepache","q":"200 cc","nota":""},{"n":"Alginat de sodi","q":"10 g","nota":""},{"n":"Sucre (mascavat/ros) o xilitol","q":"200 g","nota":""},{"n":"Llimona o llima (suc i pell)","q":"1/2 unitat","nota":""},{"n":"Sal marina","q":"1 pessic","nota":""},{"n":"Cúrcuma i canyella en pols (opcional)","q":"c/n","nota":""}],"prep":"Triturar la pinya amb el tepache, la sal, l'edulcorant i el cítric. Afegir l'alginat de sodi i tornar a triturar. Congelar.","sabor":["Vegà"]},{"categoria":"Complementària (vegana)","nombre":"Reducció d'estèvia","pagina":25,"tiempo":"40 min","ingredientes":[{"n":"Aigua filtrada","q":"1 l","nota":""},{"n":"Fulles d'estèvia seques o fresques","q":"20 g","nota":""}],"prep":"Bullir les fulles d'estèvia en aigua 10 min, colar i reduir a foc baix fins la meitat del volum.","sabor":["Vegà"]}],"es":[{"categoria":"Arte Heladero - L'Atelier Barcelona","nombre":"Masa de croissant","ingredientes":[{"n":"harina w 320","q":"1000 g"},{"n":"sal de Guérande","q":"20 g"},{"n":"azúcar","q":"120 g"},{"n":"levadura","q":"40 g"},{"n":"leche en polvo","q":"40 g"},{"n":"agua","q":"500 g"},{"n":"mantequilla seca","q":"200 g"},{"n":"mantequilla seca (laminado)","q":"650 g"}],"prep":"Amasar harina, sal, azúcar, levadura, leche en polvo, la primera mantequilla y el agua, 15 min a 1ª velocidad. Enfriar 12h a 2°C. Extender la segunda mantequilla en cuadrado, envolverla con la masa. Dar un pliegue simple, reposar 40 min a 3°C, repetir 2 veces más. Extender a 5 mm, formar y fermentar 1h30 a 25°C/75% humedad. Cocer en plancha.","sabor":["Complemento"]},{"categoria":"Arte Heladero - L'Atelier Barcelona","nombre":"Mermelada de lima","ingredientes":[{"n":"zumo de lima","q":"250 g"},{"n":"azúcar","q":"125 g"},{"n":"pectina NH","q":"10 g"}],"prep":"Calentar el zumo a 40°C y añadir el azúcar con la pectina. Hervir 30 segundos y enfriar.","sabor":["Complemento"]},{"categoria":"Arte Heladero - L'Atelier Barcelona","nombre":"Mermelada de limón","ingredientes":[{"n":"zumo de limón","q":"250 g"},{"n":"azúcar","q":"125 g"},{"n":"pectina NH","q":"10 g"}],"prep":"Calentar el zumo a 40°C, añadir el azúcar con la pectina. Hervir 30 segundos. Enfriar.","sabor":["Complemento"]},{"categoria":"Arte Heladero - L'Atelier Barcelona","nombre":"Caramelo salado","ingredientes":[{"n":"azúcar","q":"160 g"},{"n":"glucosa","q":"50 g"},{"n":"nata","q":"93 g"},{"n":"mantequilla salada","q":"140 g"},{"n":"sal","q":"2 g"}],"prep":"Caramelizar el azúcar, añadir la glucosa y la nata hirviendo con la mantequilla y la sal. Enfriar.","sabor":["Complemento"]},{"categoria":"Arte Heladero - L'Atelier Barcelona","nombre":"Praliné de avellana","ingredientes":[{"n":"azúcar","q":"200 g"},{"n":"agua","q":"70 g"},{"n":"avellana negreta tostada","q":"200 g"},{"n":"cobertura de leche Azélia 35%","q":"400 g"}],"prep":"Cocer el agua con el azúcar a 114°C. Añadir las avellanas y garrapiñar. Caramelizar. Enfriar y triturar hasta la textura deseada. Añadir el chocolate con leche atemperado.","sabor":["Complemento"]},{"categoria":"Arte Heladero - L'Atelier Barcelona","nombre":"Merengue de hierbas del Raval","ingredientes":[{"n":"claras de huevo","q":"100 g"},{"n":"albúmina","q":"5 g"},{"n":"hierbas del Raval (menta, perejil, melissa, cilantro)","q":"15 g"},{"n":"azúcar","q":"100 g"},{"n":"azúcar lustre","q":"100 g"}],"prep":"Batir las claras con la albúmina y las hierbas. Añadir el azúcar. Incorporar el azúcar lustre tamizado con espátula. Escudillar botones de merengue y secar a 60°C durante 3 horas.","sabor":["Complemento"]},{"categoria":"Arte Heladero - Ester Roelas y Carles Soler","nombre":"Toffee","ingredientes":[{"n":"nata","q":"c/s"},{"n":"glucosa","q":"c/s"},{"n":"sal","q":"c/s"},{"n":"mantequilla","q":"c/s"},{"n":"azúcar","q":"c/s"},{"n":"dextrosa","q":"64 g"}],"prep":"Hervir la nata con la glucosa, la sal y la mantequilla. En paralelo, caramelizar el azúcar con la dextrosa y desglasar con el líquido caliente sin dejar de remover. Volver a hervir y dejar enfriar. Mezclar 50% de toffee con 50% de praliné.","sabor":["Complemento"]},{"categoria":"Arte Heladero - Ester Roelas y Carles Soler","nombre":"Glaseado de cacao","ingredientes":[{"n":"glucosa líquida","q":"420 g"},{"n":"gelatina neutra (brillo neutro)","q":"500 g"},{"n":"agua","q":"100 g"},{"n":"azúcar","q":"180 g"},{"n":"cacao","q":"75 g"},{"n":"hojas de gelatina hidratadas","q":"4 u"}],"prep":"Calentar a 60°C la glucosa, gelatina neutra, agua, azúcar y cacao. Añadir las hojas de gelatina y emulsionar. Reposar 6h, calentar a 20°C y usar a esa temperatura.","sabor":["Complemento"]},{"categoria":"Arte Heladero - Ester Roelas y Carles Soler","nombre":"Disco de macaron","ingredientes":[{"n":"almendra en polvo","q":"150 g"},{"n":"azúcar lustre","q":"150 g"},{"n":"claras de huevo","q":"55 g"},{"n":"azúcar","q":"147 g"},{"n":"agua","q":"37 g"},{"n":"claras de huevo","q":"55 g"}],"prep":"Triturar la almendra con el azúcar lustre hasta obtener un polvo fino. Añadir las primeras claras y colorante, formar un mazapán. Montar las segundas claras; hacer almíbar a 117°C con agua y azúcar. Verter sobre las claras montadas. Entibiar el merengue a 50°C. Mezclar en 3 veces con el mazapán. Escudillar círculos de 8 cm. Hornear a 140°C 15-20 min sin ventilación.","sabor":["Complemento"]},{"categoria":"Arte Heladero - Ester Roelas y Carles Soler","nombre":"Impregnación de frambuesa","ingredientes":[{"n":"azúcar","q":"400 g"},{"n":"dextrosa","q":"320 g"},{"n":"agua","q":"280 g"},{"n":"frambuesa","q":"1000 g"},{"n":"agua de rosas","q":"2 g"}],"prep":"Calentar azúcar y dextrosa con agua a 60°C. Enfriar. Envasar al vacío el almíbar, las frambuesas y el agua de rosas. Repetir 5 veces (abrir y cerrar al vacío). Escurrir y usar solo la carne de la frambuesa.","sabor":["Complemento"]},{"categoria":"Arte Heladero - Ester Roelas y Carles Soler","nombre":"Bizcocho tierno de almendra","ingredientes":[{"n":"almendra tostada salada","q":"160 g"},{"n":"azúcar","q":"135 g"},{"n":"glicerina","q":"25 g"},{"n":"huevos","q":"240 g"},{"n":"claras de huevo","q":"55 g"},{"n":"azúcar","q":"35 g"},{"n":"mantequilla","q":"70 g"}],"prep":"Triturar la almendra con el azúcar. Añadir los huevos con la glicerina poco a poco, emulsionar 10 min. Montar las claras con el segundo azúcar hasta merengue firme. Incorporar la mantequilla fundida a 45°C a la mezcla de huevo, luego el merengue en 3 veces. Hornear 20 min a 180°C.","sabor":["Complemento"]},{"categoria":"Arte Heladero - Ester Roelas y Carles Soler","nombre":"Dacquoise de lima","ingredientes":[{"n":"claras de huevo","q":"150 g"},{"n":"azúcar","q":"75 g"},{"n":"almendra en polvo","q":"150 g"},{"n":"azúcar lustre","q":"150 g"},{"n":"harina floja","q":"30 g"},{"n":"ralladuras de lima","q":"2 u"}],"prep":"Montar las claras con el azúcar. Mezclar con el resto de ingredientes secos. Escudillar en placa del tamaño del marco. Hornear a 180°C 15 min con ventilación. Congelar.","sabor":["Complemento"]},{"categoria":"Arte Heladero - Ester Roelas y Carles Soler","nombre":"Crujiente de streusel","ingredientes":[{"n":"almendra tostada salada","q":"50 g"},{"n":"harina floja","q":"50 g"},{"n":"azúcar moreno","q":"50 g"},{"n":"mantequilla fría a dados","q":"50 g"},{"n":"pasta de almendra tostada salada","q":"50 g"},{"n":"chocolate blanco fundido","q":"50 g"},{"n":"streusel (de arriba)","q":"150 g"}],"prep":"Triturar almendra, harina y azúcar moreno. Mezclar con la mantequilla fría hasta arenilla gorda. Hornear a 150°C 20 min. Para el crujiente: mezclar pasta de almendra con chocolate blanco fundido, añadir el streusel y extender fino entre hojas de guitarra. Congelar.","sabor":["Complemento"]},{"categoria":"Arte Heladero - Ester Roelas y Carles Soler","nombre":"Agar agar de menta","ingredientes":[{"n":"hojas de menta","q":"10 g"},{"n":"agua","q":"100 g"},{"n":"azúcar","q":"100 g"},{"n":"zumo de limón","q":"600 g"},{"n":"dextrosa","q":"120 g"},{"n":"agar agar","q":"8 g"},{"n":"azúcar","q":"70 g"}],"prep":"Escaldar la menta 30 seg, cortar cocción en agua con hielo. Triturar fino con el azúcar. Reservar 8h en frío, colar (almíbar de menta). Calentar zumo de limón con dextrosa; a 40°C añadir azúcar con agar agar. Hervir 1 min, enfriar. A 50°C añadir el almíbar de menta. Dejar cuajar y romper la estructura con varillas.","sabor":["Complemento"]},{"categoria":"Arte Heladero - Ester Roelas y Carles Soler","nombre":"Impregnación de fresas con anís","ingredientes":[{"n":"azúcar","q":"400 g"},{"n":"agua","q":"280 g"},{"n":"dextrosa","q":"320 g"},{"n":"fresas","q":"1000 g"},{"n":"licor de anís","q":"100 g"}],"prep":"Calentar azúcar, agua y dextrosa a 60°C. Enfriar. Envasar al vacío con las fresas y el licor. Repetir 5 veces hasta que las fresas se impregnen bien.","sabor":["Complemento"]},{"categoria":"Arte Heladero - Bobby Cortez","nombre":"Piel de naranja confitada","ingredientes":[{"n":"naranjas cara cara","q":"4 u"},{"n":"agua","q":"250 ml"},{"n":"azúcar","q":"45 g"}],"prep":"Pelar las naranjas, retirar el exceso de albedo. Blanquear las pieles partiendo de agua fría, hervir y colar, repetir 6 veces. Cocer a fuego lento con agua y azúcar hasta que estén translúcidas (25 min). Enfriar, añadir zumo de media naranja.","sabor":["Complemento"]},{"categoria":"Arte Heladero - Bobby Cortez","nombre":"Panal de yemas curadas con miso","ingredientes":[{"n":"panales de miel frescos","q":"2 u"},{"n":"yemas de huevo","q":"8 u"},{"n":"miso blanc const NEUTRO_INGREDIENT_NAME={0:"Goma Garrofín",1:"goma guar",2:"goma tara",3:"Carragenato",4:"Carboximetilcelulosa",5:"Gelatina",6:"Pectina NH",7:"agar-agar",8:"alginato de sodio",9:"Goma Gellan",10:"lecitina de soja",11:"Goma Xantana"};const REFERENCIA={"neutros":{"es":[{"nombre":"Goma Garrofín (LBG)","propiedad":"Gran espesante / anticristalización","activacion":"Calor (~80°C)","caracteristicas":"Retrasa muchísimo el crecimiento de cristales de hielo; textura fina y fundente en boca; máxima eficacia combinada con Xantana.","uso":"Base de casi todas las mezclas de neutro (50-60% del total).","evitar":"Si no se calienta a 80°C no desarrolla su viscosidad — inútil en bases raw/frías sin cocción."},{"nombre":"Goma Guar","propiedad":"Hidratación rápida / espesante en frío","activacion":"Frío o caliente","caracteristicas":"Muy potente y económica; aporta viscosidad inmediata sin necesidad de calor.","uso":"Helados económicos, salsas, mezclas sin gluten, bases raw sin cocción.","evitar":"En exceso da una textura gomosa/elástica; no superar ~20-25% del neutro total."},{"nombre":"Goma Tara (E417)","propiedad":"Similar al Garrofín, funciona en frío","activacion":"Frío o caliente","caracteristicas":"Del árbol de la tara (Perú); aporta volumen y untuosidad, retrasa cristales.","uso":"Alternativa al Garrofín cuando no se puede calentar a 80°C.","evitar":"Menos probada que el Garrofín; dosifica con cautela la primera vez."},{"nombre":"Carragenato","propiedad":"Estabilizante de lácteos","activacion":"Calor (~70°C)","caracteristicas":"Evita la sinéresis (que la leche/nata suelte suero); interactúa con las proteínas lácteas.","uso":"Bases de nata/leche, flanes, natillas, mezclas lácteas líquidas.","evitar":"Se usa en dosis muy bajas (0,02-0,05% del mix); un exceso da una textura gelificada indeseada."},{"nombre":"CMC / Carboximetilcelulosa (E466)","propiedad":"Estabilizante soluble en frío","activacion":"Frío o caliente","caracteristicas":"Deriva de la celulosa vegetal; combina bien con guar o carragenato para dar viscosidad extra.","uso":"Sustituto del Carragenato cuando se trabaja en frío. ~0,5 g por kg de mezcla.","evitar":"Por sí solo aporta menos untuosidad que el Carragenato calentado."},{"nombre":"Gelatina (E428)","propiedad":"Estabilizante/gelificante animal","activacion":"Calor (para disolver)","caracteristicas":"Da cuerpo untuoso; de origen animal.","uso":"Repostería y helados no veganos.","evitar":"NO apta para recetas veganas. Necesita calor para disolver bien."},{"nombre":"Pectina NH","propiedad":"Gelificante","activacion":"Calor + medio ácido","caracteristicas":"Crea texturas tipo mermelada o gel elástico; resiste bien la acidez de la fruta.","uso":"Sorbetes de fruta, rellenos, coberturas.","evitar":"Sin acidez suficiente en el medio no gelifica bien; no aporta nada en bases de leche."},{"nombre":"Agar-agar (E406)","propiedad":"Gelificante de algas rojas","activacion":"Calor (2,5 g/l de agua)","caracteristicas":"Gelifica firme y de forma termorreversible.","uso":"Gelatinas y coberturas; poco usado solo, se suele combinar.","evitar":"Necesita calor para activarse — no sirve en preparaciones en frío puro."},{"nombre":"Alginato de sodio (E401)","propiedad":"Gelificante de algas pardas","activacion":"Frío (activa con calcio)","caracteristicas":"Es la única alternativa a la Pectina que funciona en frío puro.","uso":"Esferificación y sorbetes de fruta ácida.","evitar":"Activa con calcio, no con calor — la dosis varía mucho según la receta."},{"nombre":"Goma Gellan (E418)","propiedad":"Gelificante muy firme y termoestable","activacion":"Calor","caracteristicas":"Gelifica de forma muy firme y aguanta temperatura.","uso":"Más usado en repostería moderna que en heladería clásica.","evitar":"Necesita calor para activarse; textura muy firme si no se dosifica con cuidado."},{"nombre":"Lecitina / E471","propiedad":"Emulsionante","activacion":"Frío o caliente","caracteristicas":"Mejora la aireación (overrun) y la cremosidad; actúa de puente entre agua y grasa.","uso":"Chocolate, mantecados, bollería; sustituye parcialmente la función de la yema de huevo.","evitar":"No es un espesante: no da cuerpo ni evita cristales de hielo por sí sola."},{"nombre":"Goma Xantana","propiedad":"Espesante universal / mejora untuosidad","activacion":"Frío o caliente","caracteristicas":"Reduce la cantidad de grasa necesaria para dar textura equivalente; gran sinergia con Garrofín; evita cristales de hielo.","uso":"Los 4 tipos de mezcla, siempre en dosis bajas (~10% del neutro total).","evitar":"Nunca superar el 10-15% del neutro total — en exceso da una textura elástica/\"baba\" desagradable."}],"ca":[{"nombre":"Goma Garrofí (LBG)","propiedad":"Gran espessant / anticristal·lització","activacion":"Calor (~80°C)","caracteristicas":"Retarda moltíssim el creixement de cristalls de gel; textura fina i fonent a la boca; màxima eficàcia combinada amb Xantana.","uso":"Base de gairebé totes les mescles de neutre (50-60% del total).","evitar":"Si no s'escalfa a 80°C no desenvolupa la seva viscositat — inútil en bases raw/fredes sense cocció."},{"nombre":"Goma Guar","propiedad":"Hidratació ràpida / espessant en fred","activacion":"Fred o calent","caracteristicas":"Molt potent i econòmica; aporta viscositat immediata sense necessitat de calor.","uso":"Gelats econòmics, salses, mescles sense gluten, bases raw sense cocció.","evitar":"En excés dona una textura gomosa/elàstica; no superar ~20-25% del neutre total."},{"nombre":"Goma Tara (E417)","propiedad":"Similar al Garrofí, funciona en fred","activacion":"Fred o calent","caracteristicas":"De l'arbre de la tara (Perú); aporta volum i untuositat, retarda cristalls.","uso":"Alternativa al Garrofí quan no es pot escalfar a 80°C.","evitar":"Menys provada que el Garrofí; dosifica amb cautela la primera vegada."},{"nombre":"Carragenat","propiedad":"Estabilitzant de làctics","activacion":"Calor (~70°C)","caracteristicas":"Evita la sinèresi (que la llet/nata deixi anar sèrum); interactua amb les proteïnes làctiques.","uso":"Bases de nata/llet, flams, natilles, mescles làctiques líquides.","evitar":"S'usa en dosis molt baixes (0,02-0,05% del mix); un excés dona una textura gelificada indesitjada."},{"nombre":"CMC / Carboximetilcel·lulosa (E466)","propiedad":"Estabilitzant soluble en fred","activacion":"Fred o calent","caracteristicas":"Deriva de la cel·lulosa vegetal; combina bé amb guar o carragenat per donar viscositat extra.","uso":"Substitut del Carragenat quan es treballa en fred. ~0,5 g per kg de mescla.","evitar":"Sol aporta menys untuositat que el Carragenat escalfat."},{"nombre":"Gelatina (E428)","propiedad":"Estabilitzant/gelificant animal","activacion":"Calor (per dissoldre)","caracteristicas":"Dona cos untuós; d'origen animal.","uso":"Pastisseria i gelats no vegans.","evitar":"NO apta per a receptes veganes. Necessita calor per dissoldre's bé."},{"nombre":"Pectina NH","propiedad":"Gelificant","activacion":"Calor + medi àcid","caracteristicas":"Crea textures tipus melmelada o gel elàstic; resisteix bé l'acidesa de la fruita.","uso":"Sorbets de fruita, farciments, cobertures.","evitar":"Sense prou acidesa al medi no gelifica bé; no aporta res en bases de llet."},{"nombre":"Agar-agar (E406)","propiedad":"Gelificant d'algues roges","activacion":"Calor (2,5 g/l d'aigua)","caracteristicas":"Gelifica ferm i de forma termoreversible.","uso":"Gelatines i cobertures; poc usat sol, se sol combinar.","evitar":"Necessita calor per activar-se — no serveix en preparacions en fred pur."},{"nombre":"Alginat de sodi (E401)","propiedad":"Gelificant d'algues brunes","activacion":"Fred (activa amb calci)","caracteristicas":"És l'única alternativa a la Pectina que funciona en fred pur.","uso":"Esferificació i sorbets de fruita àcida.","evitar":"Activa amb calci, no amb calor — la dosi varia molt segons la recepta."},{"nombre":"Goma Gellan (E418)","propiedad":"Gelificant molt ferm i termoestable","activacion":"Calor","caracteristicas":"Gelifica de forma molt ferma i aguanta temperatura.","uso":"Més usat en pastisseria moderna que en heladeria clàssica.","evitar":"Necessita calor per activar-se; textura molt ferma si no es dosifica amb cura."},{"nombre":"Lecitina / E471","propiedad":"Emulsionant","activacion":"Fred o calent","caracteristicas":"Millora l'aireig (overrun) i la cremositat; actua de pont entre aigua i greix.","uso":"Xocolata, mantecats, forneria; substitueix parcialment la funció del rovell d'ou.","evitar":"No és un espessant: no dona cos ni evita cristalls de gel per si sola."},{"nombre":"Goma Xantana","propiedad":"Espessant universal / millora la untuositat","activacion":"Fred o calent","caracteristicas":"Redueix la quantitat de greix necessària per donar textura equivalent; gran sinergia amb Garrofí; evita cristalls de gel.","uso":"Els 4 tipus de mescla, sempre en dosis baixes (~10% del neutre total).","evitar":"Mai superar el 10-15% del neutre total — en excés dona una textura elàstica/\"baba\" desagradable."}]},"azucares":{"es":[{"nombre":"Sacarosa","pod":100,"pac":100,"categoria":"Azúcar de referencia","caracteristicas":"Es el azúcar de mesa común; POD y PAC de referencia (ambos = 100) frente a los que se miden todos los demás.","uso":"Base de casi cualquier mezcla de helado.","evitar":"Usada en solitario en dosis altas puede dar una sensación de dulzor plano; se suele combinar con dextrosa."},{"nombre":"Dextrosa","pod":74,"pac":171,"categoria":"Monosacárido","caracteristicas":"Menos dulce que la sacarosa pero con mucho más poder anticongelante — clave para dar textura sin pasarse de dulzor.","uso":"Sustituir 20-30% del azúcar total por dextrosa para bajar el punto de congelación sin dulcificar de más.","evitar":"Sola, en exceso, deja el helado demasiado blando/poco firme."},{"nombre":"Fructosa","pod":170,"pac":190,"categoria":"Monosacárido","caracteristicas":"El azúcar más dulce de uso común; también aporta mucho anticongelante.","uso":"Pequeñas cantidades para potenciar el dulzor sin añadir mucho peso de azúcar total.","evitar":"Muy cara comparada con sacarosa/dextrosa; en exceso el dulzor resulta empalagoso."},{"nombre":"Azúcar invertido","pod":130,"pac":190,"categoria":"Jarabe (mezcla glucosa+fructosa)","caracteristicas":"Muy higroscópico: retiene agua y evita la cristalización, dando una textura muy suave.","uso":"Helados de textura extra cremosa y sorbetes; evita que se forme escarcha en el congelador.","evitar":"Textura pegajosa si se usa en exceso; puede ablandar demasiado el producto final."},{"nombre":"Miel","pod":130,"pac":190,"categoria":"Azúcar natural","caracteristicas":"Efecto similar al azúcar invertido, pero aporta además sabor y color propios.","uso":"Helados con perfil de sabor a miel, o como sustituto parcial natural del azúcar invertido.","evitar":"Su sabor propio puede chocar con otros perfiles de sabor; más cara que el azúcar invertido."},{"nombre":"Glucosa atomizada (DE bajo, ~21DE)","pod":10,"pac":20,"categoria":"Jarabe de glucosa en polvo","caracteristicas":"Aporta cuerpo y sólidos con muy poco dulzor ni anticongelante — es más un \"relleno\" estructural.","uso":"Subir el extracto seco (sólidos) de una mezcla sin dulcificarla apenas.","evitar":"No sirve para ajustar el punto de congelación; hace falta combinarla con dextrosa o azúcar invertido."},{"nombre":"Glucosa atomizada (DE alto, ~38-42DE)","pod":24,"pac":45,"categoria":"Jarabe de glucosa en polvo","caracteristicas":"A mayor DE (dextrosa equivalente), más dulce y con más poder anticongelante que la de DE bajo.","uso":"Ajustar textura y dulzor de forma intermedia entre la de DE bajo y la dextrosa pura.","evitar":"Elegir el DE incorrecto puede dar demasiado o muy poco anticongelante."},{"nombre":"Xilitol","pod":100,"pac":220,"categoria":"Polialcohol (edulcorante)","caracteristicas":"Tan dulce como la sacarosa pero con más del doble de poder anticongelante; apto para dietas bajas en azúcar.","uso":"Recetas \"sin azúcar añadido\" que necesitan mantener textura escoopable.","evitar":"Tóxico para perros — precaución en obradores con mascotas. En exceso, efecto laxante."},{"nombre":"Maltodextrina","pod":15,"pac":15,"categoria":"Polisacárido (relleno)","caracteristicas":"Prácticamente no aporta dulzor; solo sube los sólidos totales de la mezcla.","uso":"Dar cuerpo a sorbetes o mezclas muy líquidas sin dulcificarlas.","evitar":"No debe considerarse como aporte de anticongelante — su PAC es bajo."},{"nombre":"Glicerina","pod":75,"pac":342,"categoria":"Poliol humectante","caracteristicas":"El anticongelante más potente de la tabla; mantiene el helado blando incluso a temperaturas muy bajas.","uso":"Pequeñas dosis (5-10 g/kg) para asegurar que el helado se pueda servir directamente del congelador doméstico.","evitar":"En exceso deja un regusto ligeramente jabonoso/dulzón y una textura demasiado blanda."}],"ca":[{"nombre":"Sacarosa","pod":100,"pac":100,"categoria":"Sucre de referència","caracteristicas":"És el sucre de taula comú; POD i PAC de referència (tots dos = 100) respecte als quals es mesuren la resta.","uso":"Base de gairebé qualsevol mescla de gelat.","evitar":"Usada en solitari en dosis altes pot donar una sensació de dolçor plana; se sol combinar amb dextrosa."},{"nombre":"Dextrosa","pod":74,"pac":171,"categoria":"Monosacàrid","caracteristicas":"Menys dolça que la sacarosa però amb molt més poder anticongelant — clau per donar textura sense passar-se de dolçor.","uso":"Substituir 20-30% del sucre total per dextrosa per baixar el punt de congelació sense endolcir de més.","evitar":"Sola, en excés, deixa el gelat massa tou/poc ferm."},{"nombre":"Fructosa","pod":170,"pac":190,"categoria":"Monosacàrid","caracteristicas":"El sucre més dolç d'ús comú; també aporta molt anticongelant.","uso":"Petites quantitats per potenciar la dolçor sense afegir gaire pes de sucre total.","evitar":"Molt cara comparada amb sacarosa/dextrosa; en excés la dolçor resulta embafadora."},{"nombre":"Sucre invertit","pod":130,"pac":190,"categoria":"Xarop (barreja glucosa+fructosa)","caracteristicas":"Molt higroscòpic: reté aigua i evita la cristal·lització, donant una textura molt suau.","uso":"Gelats de textura extra cremosa i sorbets; evita que es formi gebre al congelador.","evitar":"Textura enganxosa si s'usa en excés; pot estovar massa el producte final."},{"nombre":"Mel","pod":130,"pac":190,"categoria":"Sucre natural","caracteristicas":"Efecte similar al sucre invertit, però aporta a més sabor i color propis.","uso":"Gelats amb perfil de sabor a mel, o com a substitut parcial natural del sucre invertit.","evitar":"El seu sabor propi pot xocar amb altres perfils de sabor; més cara que el sucre invertit."},{"nombre":"Glucosa atomitzada (DE baix, ~21DE)","pod":10,"pac":20,"categoria":"Xarop de glucosa en pols","caracteristicas":"Aporta cos i sòlids amb molt poca dolçor ni anticongelant — és més un \"farciment\" estructural.","uso":"Pujar l'extracte sec (sòlids) d'una mescla sense endolcir-la gairebé.","evitar":"No serveix per ajustar el punt de congelació; cal combinar-la amb dextrosa o sucre invertit."},{"nombre":"Glucosa atomitzada (DE alt, ~38-42DE)","pod":24,"pac":45,"categoria":"Xarop de glucosa en pols","caracteristicas":"A major DE (dextrosa equivalent), més dolça i amb més poder anticongelant que la de DE baix.","uso":"Ajustar textura i dolçor de forma intermèdia entre la de DE baix i la dextrosa pura.","evitar":"Triar el DE incorrecte pot donar massa o molt poc anticongelant."},{"nombre":"Xilitol","pod":100,"pac":220,"categoria":"Polialcohol (edulcorant)","caracteristicas":"Tan dolç com la sacarosa però amb més del doble de poder anticongelant; apte per a dietes baixes en sucre.","uso":"Receptes \"sense sucre afegit\" que necessiten mantenir textura escoopable.","evitar":"Tòxic per a gossos — precaució en obradors amb mascotes. En excés, efecte laxant."},{"nombre":"Maltodextrina","pod":15,"pac":15,"categoria":"Polisacàrid (farciment)","caracteristicas":"Pràcticament no aporta dolçor; només puja els sòlids totals de la mescla.","us
